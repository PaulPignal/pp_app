name: Offi cadence stats

# Mesure la cadence réelle du flux offi (arrivées par section, jour de semaine,
# délai de publication) depuis Work.createdAt. Lecture seule, sortie agrégée dans
# le log du job : aucune donnée nominative, aucun secret imprimé.
#
# Déclenchement manuel uniquement. Workflow d'analyse : à supprimer une fois la
# cadence arbitrée, ou à garder si on veut la réévaluer chaque trimestre.

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL manquant."; exit 1
          fi
          if ! command -v psql >/dev/null; then
            sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client
          fi
          # ON_ERROR_STOP : une requête cassée doit faire échouer le job, pas passer inaperçue.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/cadence-stats.sql
