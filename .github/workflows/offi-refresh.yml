name: Offi refresh

# Rafraîchit les données offi → Neon, automatiquement, UNE SECTION PAR JOUR :
#   - quotidien 05:30 UTC (07:30 Paris l'été) : cinema + visite
#   - lundi    03:00 UTC : theatre
#   - mardi    03:00 UTC : concert
#   - mercredi 03:00 UTC : exposition + enfants
#   - dimanche 06:00 UTC : catalogue des lieux + relink des œuvres
#
# Cadence arbitrée sur les données, pas au doigt mouillé :
#   - cinema : 98 % des date_start tombent un mercredi (168 sorties observées) ;
#     pagination par pertinence, donc les nouveautés sont toujours en tête. Quotidien
#     par confort (~11 min) plus que par nécessité.
#   - visite : 62 % de dates uniques, 44 % captées à moins de 7 jours de leur début et
#     premier quartile à 5 jours (mesuré sur startDate - createdAt). En hebdomadaire on
#     en perd une partie avant même de l'avoir ingérée. 10 pages, ~4 min : quotidien.
#   - concert : le plus gros volume et 75 % de dates uniques, mais captés avec 11 jours
#     d'avance au premier quartile et 49 en médiane → un passage hebdomadaire suffit.
#     Pagination chronologique : le plafond de 150 pages coupe le lointain (au-delà de
#     février 2027), et un run tronqué par le timeout ingère l'imminent en premier.
#   - theatre, exposition, enfants : durées d'exploitation médianes de 98 à 125 jours,
#     5 % seulement démarrent sous 7 jours → hebdomadaire, voire large.
#
# Pourquoi une section par jour : à froid le crawl coûte ~20 s par page de programme
# (15 fiches détaillées par page). Les 6 sections = ~340 pages ≈ 2 h, soit bien plus
# que le timeout du job. Crawler tout chaque jour a donc gelé l'ingestion du
# 13/06/2026 au 10/08/2026 (58 runs annulés à 90 min, tmp jeté, zéro ligne ingérée).
# Découpé, le pire cas (concert, 150 pages) tient en ~55 min et chaque section est
# rafraîchie au moins une fois par semaine.
#
# Pré-requis : secret de dépôt DATABASE_URL (chaîne de connexion Neon).
# Le cache JSONL est persisté PAR SECTION (actions/cache) pour profiter du
# rafraîchissement incrémental à 72 h du scraper (poli envers offi.fr). Une clé par
# section est obligatoire : le scraper n'écrit que ce qu'il crawle, donc un cache
# unique serait écrasé (et les autres sections perdues) à chaque run mono-section.

on:
  schedule:
    - cron: '30 5 * * *'      # tous les jours — cinema + visite
    - cron: '0 3 * * 1'       # lundi — theatre
    - cron: '0 3 * * 2'       # mardi — concert
    - cron: '0 3 * * 3'       # mercredi — exposition, enfants
    - cron: '0 6 * * 0'       # dimanche — lieux
  workflow_dispatch:
    inputs:
      target:
        description: 'cinema,visite | theatre | concert | exposition,enfants | venues | all'
        required: false
        default: 'cinema,visite'

concurrency:
  group: offi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 90 min : large pour une section (pire cas concert ~55 min). Un reseed complet se
    # fait section par section, pas en un `all` — pas d'expression conditionnelle ici,
    # elle empêchait la création du job (run bloqué en `queued` sans job, 10/08/2026).
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # env.ts exige NEXTAUTH_SECRET ; l'ingestion ne l'utilise pas → placeholder
      # si le secret n'est pas défini, pour ne dépendre que de DATABASE_URL.
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-ingestion-placeholder' }}
      OFFI_PYTHON_BIN: python3
      OFFI_MAX_PAGES: '150'
      OFFI_REFRESH_AFTER_HOURS: '72'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # Node 22 requis : Prisma 7 (migrate deploy) importe node:sqlite,
          # absent de Node 20 (ERR_UNKNOWN_BUILTIN_MODULE). Le local tourne en 22.
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      # Le pipeline lance `pnpm --dir app` depuis la racine (sans packageManager) :
      # on active globalement la version épinglée par app/package.json (pnpm@10),
      # sinon pnpm 11 par défaut refuse le projet (version mismatch).
      - run: corepack prepare pnpm@10.0.0 --activate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt

      - name: Install app deps (postinstall → prisma generate)
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Décidé AVANT la restauration du cache : la clé de cache dépend des sections.
      - name: Decide targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          # Via env (et pas en interpolation directe dans le script) : l'input est
          # une chaîne libre → pas d'injection shell possible.
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          ALL='theatre,cinema,exposition,concert,visite,enfants'
          sections=''
          do_venues=false

          if [ "$EVENT_NAME" = 'schedule' ]; then
            case "$SCHEDULE" in
              '0 6 * * 0') do_venues=true ;;
              '0 3 * * 1') sections='theatre' ;;
              '0 3 * * 2') sections='concert' ;;
              '0 3 * * 3') sections='exposition,enfants' ;;
              *)           sections='cinema,visite' ;;
            esac
          else
            case "$TARGET" in
              venues) do_venues=true ;;
              all)    sections="$ALL"; do_venues=true ;;
              works)  sections="$ALL" ;;
              '')     sections='cinema,visite' ;;
              *)      sections="$TARGET" ;;
            esac
          fi

          # Garde-fou : une section inconnue ferait un crawl vide (donc un fichier
          # vide, donc un `mv` qui écrase le cache) → on échoue tôt et clairement.
          for section in $(printf '%s' "$sections" | tr ',' ' '); do
            case ",$ALL," in
              *",$section,"*) ;;
              *) echo "::error::Section inconnue: $section (attendu parmi $ALL)"; exit 1 ;;
            esac
          done

          {
            echo "sections=$sections"
            echo "do_venues=$do_venues"
            echo "slug=$(printf '%s' "$sections" | tr ',' '-')"
          } >> "$GITHUB_OUTPUT"

      # Restaure le JSONL de la section du run précédent (restore seul : la sauvegarde
      # se fait en fin de job même en cas d'échec → les retries sont incrémentaux).
      - name: Restore JSONL cache
        if: steps.plan.outputs.sections != ''
        uses: actions/cache/restore@v4
        with:
          path: data/offi-${{ steps.plan.outputs.slug }}.jsonl
          key: offi-jsonl-${{ steps.plan.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            offi-jsonl-${{ steps.plan.outputs.slug }}-

      # Fail-fast : valide DB + migrations + Node/pnpm en ~10 s AVANT le scrape de
      # ~40 min. Les pannes d'env (node:sqlite, version pnpm…) échouent ici, vite.
      - name: Preflight — migrations (fail-fast avant le scrape)
        working-directory: app
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Refresh works (scrape → ingest)
        if: steps.plan.outputs.sections != ''
        # Migrations déjà faites au préflight → on saute celles du pipeline.
        # Chemin ABSOLU obligatoire : le pipeline passe le fichier à
        # `pnpm --dir app ingest:offi`, dont le cwd est app/.
        env:
          OFFI_SKIP_DB_DEPLOY: '1'
          OFFI_SECTIONS: ${{ steps.plan.outputs.sections }}
          OFFI_OUTPUT_FILE: ${{ github.workspace }}/data/offi-${{ steps.plan.outputs.slug }}.jsonl
        run: ./scripts/offi-pipeline.sh

      - name: Refresh venues catalog + relink
        if: steps.plan.outputs.do_venues == 'true'
        working-directory: app
        run: pnpm exec tsx scripts/backfill-venues.ts all 2000

      # Sauvegarde le cache JSONL même si une étape précédente a échoué : le scrape
      # déjà fait n'est pas perdu, le prochain run repart de là (incrémental).
      - name: Save JSONL cache
        if: always() && steps.plan.outputs.sections != ''
        uses: actions/cache/save@v4
        with:
          path: data/offi-${{ steps.plan.outputs.slug }}.jsonl
          key: offi-jsonl-${{ steps.plan.outputs.slug }}-${{ github.run_id }}

      # Le JSONL scrapé est aussi exposé en artefact : si l'ingestion échoue, on peut
      # le télécharger et rejouer l'ingest seul (idempotent) sans relancer le scrape.
      - name: Upload JSONL artifact
        if: always() && steps.plan.outputs.sections != '' && hashFiles(format('data/offi-{0}.jsonl', steps.plan.outputs.slug)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: offi-jsonl-${{ steps.plan.outputs.slug }}-${{ github.run_id }}
          path: data/offi-${{ steps.plan.outputs.slug }}.jsonl
          retention-days: 7
