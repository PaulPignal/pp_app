name: Offi refresh

# Rafraîchit les données offi → Neon, automatiquement, UNE SECTION PAR JOUR
# (heures UTC ; Paris = UTC+2 l'été, UTC+1 l'hiver) :
#   - jeudi 04:17 UTC (05:17 / 06:17 Paris) : cinema + visite (hebdomadaire depuis le 07/11/2026,
#     cinéma mis de côté ; jeudi = lendemain des sorties du mercredi)
#   - lundi     02:43 UTC : theatre
#   - mardi     02:43 UTC : concert
#   - mercredi  02:47 UTC : exposition + enfants
#   - dimanche  05:23 UTC : catalogue des lieux + relink des œuvres
#
# Heures de départ : minutes « creuses » (:17, :43, :47, :23) plutôt que :00 et :30,
# créneaux les plus encombrés de GitHub. Mesuré sur 85 runs planifiés (08/2026 à
# 10/2026) : le départ réel a un retard médian de 274 min (cinema+visite), 335 (theatre),
# 302 (concert), 280 (exposition+enfants), maximum 727 min. Le retard médian grossit :
# 41 min en août, 289 en septembre, 391 en octobre. L'heure du cron n'est donc pas
# l'heure d'exécution : les données sont prêtes vers 09:00 à 12:00 Paris en octobre.
# Hypothèse (non prouvée) : une minute creuse réduit ce retard.
#
# Cadence arbitrée sur les mesures des logs CI (rapport T1-cadence.md), pas au doigt
# mouillé. Les artefacts JSONL (7 jours de rétention) avaient tous expiré quand la
# mesure a été faite : seuls les comptes de fiches par run sont connus, pas les champs
# modifiés. La rétention passe à 90 jours pour permettre la mesure fiche à fiche.
#   - cinema : nombre de fiches du listing entre 386 et 747 selon le jour de semaine
#     (creux le lundi, moyenne 429 ; pic le mardi, moyenne 656) : le programme se
#     renouvelle chaque semaine et varie de ~66 fiches par jour en valeur absolue
#     (médiane 36). Quotidien : un run coûte 2 à 24 min (médiane 5 min).
#   - visite : 104 à 165 fiches, variation médiane de 4 fiches par jour ; fiches à date
#     unique, donc périssables (mesure du 10/08 : 44 % captées à moins de 7 jours de
#     leur début, mais mesure faite sur 3 jours d'arrivées seulement : à confirmer par
#     le SQL de scripts/cadence-stats.sql en b1388fb). Quotidien, avec cinema.
#   - concert : le listing est plafonné à 150 pages (2 249 fiches, identique à ±2 sur les
#     10 runs). Mesuré : les pages 151 et 199 contiennent encore 15 fiches chacune, donc
#     le plafond coupe le lointain (la page 150 s'arrête fin mars / début avril 2027).
#     Run de 55 min en moyenne (54 à 81) pour ~2 400 requêtes. Hebdomadaire : 1 requête
#     détail par fiche chaque semaine, aucune réutilisation de cache (voir ci-dessous).
#   - theatre : 1 814 fiches (08/08) → 2 232 (05/10), plateau depuis fin septembre.
#     Run de 46 à 56 min. Hebdomadaire.
#   - exposition, enfants : 281 et 293 fiches (+23 % et +15 % en 8 semaines), 13 à 14 min.
#     Hebdomadaire (la fenêtre STALE_AFTER_DAYS interdit de descendre sous 1 passage
#     par semaine sans la rallonger).
#
# OFFI_REFRESH_AFTER_HOURS = 72 : mesuré, pour les sections hebdomadaires la fiche en
# cache a toujours 168 h, soit plus que 72 h : 0 fiche réutilisée sur les 21 runs
# hebdomadaires avec cache de theatre, concert et exposition+enfants (hors le run de
# concert du 11/08, lancé la veille d'un run complet : 2 242 réutilisées sur 2 249,
# 4 minutes au lieu de 55). Toute valeur de 1 à 167 donne le même résultat pour elles.
# Pour cinema et visite (quotidiens jusqu'au 07/11/2026), 72 h fait refetcher en moyenne 31 % des fiches par
# run (médiane 17 %) au lieu de toutes, soit 277 requêtes par run en moyenne : on garde 72. Passer concert à 200 h économiserait la moitié des
# requêtes (une semaine sur deux), au prix de prix/horaires vieux de 14 jours : non
# retenu, aucune mesure de la vitesse de changement d'une fiche détail (hypothèse).
#
# Pourquoi une section par jour : à froid le crawl coûte ~20 s par page de programme
# (15 fiches détaillées par page). Les 6 sections = ~340 pages ≈ 2 h, soit bien plus
# que le timeout du job. Crawler tout chaque jour a donc gelé l'ingestion du
# 13/06/2026 au 10/08/2026 (58 runs annulés à 90 min, tmp jeté, zéro ligne ingérée).
# Découpé, le pire cas (concert, 150 pages) tient en ~55 min et chaque section est
# rafraîchie au moins une fois par semaine.
#
# Désactivation GitHub : sans activité du dépôt pendant 60 jours, GitHub désactive les
# workflows planifiés (constaté : dernier push le 10/08, désactivation le 09/10). Le job
# `keepalive` ci-dessous pousse un commit vide quand le dernier commit a 45 jours ou
# plus, avec le seul GITHUB_TOKEN (aucun secret ajouté). Il ne peut pas réactiver un
# workflow déjà désactivé : voir le rapport.
#
# Pré-requis : secret de dépôt DATABASE_URL (chaîne de connexion Neon).
# Le cache JSONL est persisté PAR SECTION (actions/cache) pour profiter du
# rafraîchissement incrémental à 72 h du scraper (poli envers offi.fr). Une clé par
# section est obligatoire : le scraper n'écrit que ce qu'il crawle, donc un cache
# unique serait écrasé (et les autres sections perdues) à chaque run mono-section.

on:
  schedule:
    - cron: '17 4 * * 4'      # jeudi : cinema + visite
    - cron: '43 2 * * 1'      # lundi — theatre
    - cron: '43 2 * * 2'      # mardi — concert
    - cron: '47 2 * * 3'      # mercredi — exposition, enfants
    - cron: '23 5 * * 0'      # dimanche — lieux
  workflow_dispatch:
    inputs:
      target:
        description: 'cinema,visite | theatre | concert | exposition,enfants | venues | all'
        required: false
        default: 'cinema,visite'

concurrency:
  group: offi-refresh
  cancel-in-progress: false

# Jeton GITHUB_TOKEN en lecture seule par défaut (seul le job keepalive, s'il existe, écrit).
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 120 min : large pour une section (concert à 200 pages depuis le 07/11/2026, ~75 min estimées). Un reseed complet se
    # fait section par section, pas en un `all` — pas d'expression conditionnelle ici,
    # elle empêchait la création du job (run bloqué en `queued` sans job, 10/08/2026).
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # env.ts exige NEXTAUTH_SECRET ; l'ingestion ne l'utilise pas : valeur factice en dur
      # (32 caractères ou plus), aucun secret de production exposé à ce job.
      NEXTAUTH_SECRET: 'ci-ingestion-placeholder-not-a-real-secret'
      OFFI_PYTHON_BIN: python3
      OFFI_MAX_PAGES: '200'
      OFFI_REFRESH_AFTER_HOURS: '72'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # Node 22 requis : Prisma 7 (migrate deploy) importe node:sqlite,
          # absent de Node 20 (ERR_UNKNOWN_BUILTIN_MODULE). Le local tourne en 22.
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      # Le pipeline lance `pnpm --dir app` depuis la racine (sans packageManager) :
      # on active globalement la version épinglée par app/package.json (pnpm@10),
      # sinon pnpm 11 par défaut refuse le projet (version mismatch).
      - run: corepack prepare pnpm@10.0.0 --activate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt

      - name: Install app deps (postinstall → prisma generate)
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Décidé AVANT la restauration du cache : la clé de cache dépend des sections.
      - name: Decide targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          # Via env (et pas en interpolation directe dans le script) : l'input est
          # une chaîne libre → pas d'injection shell possible.
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          ALL='theatre,cinema,exposition,concert,visite,enfants'
          sections=''
          do_venues=false

          if [ "$EVENT_NAME" = 'schedule' ]; then
            case "$SCHEDULE" in
              '23 5 * * 0') do_venues=true ;;
              '43 2 * * 1') sections='theatre' ;;
              '43 2 * * 2') sections='concert' ;;
              '47 2 * * 3') sections='exposition,enfants' ;;
              *)           sections='cinema,visite' ;;
            esac
          else
            case "$TARGET" in
              venues) do_venues=true ;;
              all)    sections="$ALL"; do_venues=true ;;
              works)  sections="$ALL" ;;
              '')     sections='cinema,visite' ;;
              *)      sections="$TARGET" ;;
            esac
          fi

          # Garde-fou : une section inconnue ferait un crawl vide (donc un fichier
          # vide, donc un `mv` qui écrase le cache) → on échoue tôt et clairement.
          for section in $(printf '%s' "$sections" | tr ',' ' '); do
            case ",$ALL," in
              *",$section,"*) ;;
              *) echo "::error::Section inconnue: $section (attendu parmi $ALL)"; exit 1 ;;
            esac
          done

          {
            echo "sections=$sections"
            echo "do_venues=$do_venues"
            echo "slug=$(printf '%s' "$sections" | tr ',' '-')"
          } >> "$GITHUB_OUTPUT"

      # Restaure le JSONL de la section du run précédent (restore seul : la sauvegarde
      # se fait en fin de job même en cas d'échec → les retries sont incrémentaux).
      - name: Restore JSONL cache
        if: steps.plan.outputs.sections != ''
        uses: actions/cache/restore@v4
        with:
          path: data/offi-${{ steps.plan.outputs.slug }}.jsonl
          key: offi-jsonl-${{ steps.plan.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            offi-jsonl-${{ steps.plan.outputs.slug }}-

      # Fail-fast : valide DB + migrations + Node/pnpm en ~10 s AVANT le scrape de
      # ~40 min. Les pannes d'env (node:sqlite, version pnpm…) échouent ici, vite.
      # Réveil de Neon : le compute passe en veille, et le premier connect peut dépasser
      # les 5 s que Prisma laisse par défaut. Le run 37927345372 (09/10/2026) a échoué ainsi
      # en 6 s (P1001) ; sur 170 runs, ce préflight dure 4 à 8 s quand il réussit.
      # Parade : connect_timeout=30 et 5 tentatives avec backoff (10, 20, 40, 80 s) sur les
      # seules erreurs de connexion. Toute autre erreur (migration, env) échoue tout de suite.
      - name: Preflight — réveil Neon + migrations (fail-fast avant le scrape)
        working-directory: app
        run: |
          set -uo pipefail
          case "$DATABASE_URL" in
            *connect_timeout=*) ;;
            *\?*) export DATABASE_URL="$DATABASE_URL&connect_timeout=30" ;;
            *)    export DATABASE_URL="$DATABASE_URL?connect_timeout=30" ;;
          esac
          LOG="$RUNNER_TEMP/preflight.log"
          delay=10
          for attempt in 1 2 3 4 5; do
            if pnpm exec prisma migrate deploy --schema prisma/schema.prisma 2>&1 | tee "$LOG"; then
              exit 0
            fi
            if ! grep -qE "P1001|P1002|P1017|Can't reach database" "$LOG"; then
              echo "::error::Préflight en échec, erreur autre qu'une connexion : pas de nouvel essai."
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning::Neon injoignable (tentative $attempt/5), nouvel essai dans ${delay}s"
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::Neon injoignable après 5 tentatives (voir la console Neon : projet suspendu, quota ?)"
          exit 1

      - name: Refresh works (scrape → ingest)
        if: steps.plan.outputs.sections != ''
        # Migrations déjà faites au préflight → on saute celles du pipeline.
        # Chemin ABSOLU obligatoire : le pipeline passe le fichier à
        # `pnpm --dir app ingest:offi`, dont le cwd est app/.
        env:
          OFFI_SKIP_DB_DEPLOY: '1'
          OFFI_SECTIONS: ${{ steps.plan.outputs.sections }}
          OFFI_OUTPUT_FILE: ${{ github.workspace }}/data/offi-${{ steps.plan.outputs.slug }}.jsonl
        run: ./scripts/offi-pipeline.sh

      - name: Refresh venues catalog + relink
        if: steps.plan.outputs.do_venues == 'true'
        working-directory: app
        run: pnpm exec tsx scripts/backfill-venues.ts all 2000

      # Sauvegarde le cache JSONL même si une étape précédente a échoué : le scrape
      # déjà fait n'est pas perdu, le prochain run repart de là (incrémental).
      - name: Save JSONL cache
        if: always() && steps.plan.outputs.sections != ''
        uses: actions/cache/save@v4
        with:
          path: data/offi-${{ steps.plan.outputs.slug }}.jsonl
          key: offi-jsonl-${{ steps.plan.outputs.slug }}-${{ github.run_id }}

      # Le JSONL scrapé est aussi exposé en artefact : si l'ingestion échoue, on peut
      # le télécharger et rejouer l'ingest seul (idempotent) sans relancer le scrape.
      - name: Upload JSONL artifact
        if: always() && steps.plan.outputs.sections != '' && hashFiles(format('data/offi-{0}.jsonl', steps.plan.outputs.slug)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: offi-jsonl-${{ steps.plan.outputs.slug }}-${{ github.run_id }}
          path: data/offi-${{ steps.plan.outputs.slug }}.jsonl
          # 90 jours (7 auparavant) : les artefacts de septembre-octobre avaient tous
          # expiré le 07/11, ce qui interdisait de mesurer les fiches nouvelles,
          # disparues et modifiées entre deux runs. ~0,4 Mo par run cinema+visite.
          retention-days: 90

  # Garde le dépôt « actif » : GitHub désactive les workflows planifiés d'un dépôt public
  # sans activité depuis 60 jours (Offi refresh et Streaming refresh désactivés le 09/10 et
  # le 10/08/2026). Un commit vide sur la branche par défaut remet le compteur à zéro.
  # Seul le GITHUB_TOKEN est utilisé (permission contents: write limitée à ce job), aucun
  # secret ajouté. Job indépendant du refresh : il tourne même si celui-ci échoue.
  # Ne tourne qu'au run du jeudi et seulement si le dernier commit a 45 jours ou plus,
  # soit au plus 8 commits vides par an. Même job dans streaming-refresh.yml : si un
  # workflow est désactivé, l'autre garde le dépôt actif.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Commit vide si le dépôt est inactif depuis 45 jours
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "Dernier commit sur $DEFAULT_BRANCH : il y a $age_days jours"
          if [ "$age_days" -lt 45 ]; then
            echo "Rien à faire."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "chore(ci): keepalive, dépôt inactif depuis $age_days jours"
          git push origin "HEAD:$DEFAULT_BRANCH"
