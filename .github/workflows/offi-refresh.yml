name: Offi refresh

# Rafraîchit les données offi → Neon, automatiquement.
#   - Quotidien 05:30 UTC (07:30 Paris l'été / 06:30 l'hiver) : pipeline œuvres
#     (scrape → migrations Prisma → ingestion). Capte les sorties ciné du mercredi,
#     les nouveaux spectacles et la dispo billetterie.
#   - Hebdomadaire (dimanche) : rafraîchit le catalogue des lieux + relie les œuvres.
#
# Pré-requis : secret de dépôt DATABASE_URL (chaîne de connexion Neon).
# Le cache JSONL est persisté entre les runs (actions/cache) pour profiter du
# rafraîchissement incrémental à 72 h du scraper (poli envers offi.fr).

on:
  schedule:
    - cron: '30 5 * * *'      # tous les jours — œuvres
    - cron: '0 6 * * 0'       # dimanche — lieux
  workflow_dispatch:
    inputs:
      target:
        description: 'works | venues | all'
        required: false
        default: 'works'

concurrency:
  group: offi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # env.ts exige NEXTAUTH_SECRET ; l'ingestion ne l'utilise pas → placeholder
      # si le secret n'est pas défini, pour ne dépendre que de DATABASE_URL.
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-ingestion-placeholder' }}
      OFFI_PYTHON_BIN: python3
      OFFI_MAX_PAGES: '150'
      OFFI_REFRESH_AFTER_HOURS: '72'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # Node 22 requis : Prisma 7 (migrate deploy) importe node:sqlite,
          # absent de Node 20 (ERR_UNKNOWN_BUILTIN_MODULE). Le local tourne en 22.
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      # Le pipeline lance `pnpm --dir app` depuis la racine (sans packageManager) :
      # on active globalement la version épinglée par app/package.json (pnpm@10),
      # sinon pnpm 11 par défaut refuse le projet (version mismatch).
      - run: corepack prepare pnpm@10.0.0 --activate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt

      - name: Install app deps (postinstall → prisma generate)
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Restaure data/offi.jsonl du run précédent (restore seul : la sauvegarde se
      # fait en fin de job même en cas d'échec → les retries sont incrémentaux).
      - name: Restore JSONL cache
        uses: actions/cache/restore@v4
        with:
          path: data/offi.jsonl
          key: offi-jsonl-${{ github.run_id }}
          restore-keys: |
            offi-jsonl-

      - name: Decide targets
        id: plan
        run: |
          # cron quotidien → works ; cron hebdo (dimanche 06:00) → venues ;
          # déclenchement manuel → input.target.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 6 * * 0" ]; then
              echo "do_works=false" >> "$GITHUB_OUTPUT"
              echo "do_venues=true" >> "$GITHUB_OUTPUT"
            else
              echo "do_works=true" >> "$GITHUB_OUTPUT"
              echo "do_venues=false" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${{ github.event.inputs.target }}" in
              venues) echo "do_works=false" >> "$GITHUB_OUTPUT"; echo "do_venues=true" >> "$GITHUB_OUTPUT" ;;
              all)    echo "do_works=true"  >> "$GITHUB_OUTPUT"; echo "do_venues=true" >> "$GITHUB_OUTPUT" ;;
              *)      echo "do_works=true"  >> "$GITHUB_OUTPUT"; echo "do_venues=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # Fail-fast : valide DB + migrations + Node/pnpm en ~10 s AVANT le scrape de
      # ~40 min. Les pannes d'env (node:sqlite, version pnpm…) échouent ici, vite.
      - name: Preflight — migrations (fail-fast avant le scrape)
        working-directory: app
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Refresh works (scrape → ingest)
        if: steps.plan.outputs.do_works == 'true'
        # Migrations déjà faites au préflight → on saute celles du pipeline.
        env:
          OFFI_SKIP_DB_DEPLOY: '1'
        run: ./scripts/offi-pipeline.sh

      - name: Refresh venues catalog + relink
        if: steps.plan.outputs.do_venues == 'true'
        working-directory: app
        run: pnpm exec tsx scripts/backfill-venues.ts all 2000

      # Sauvegarde le cache JSONL même si une étape précédente a échoué : le scrape
      # déjà fait n'est pas perdu, le prochain run repart de là (incrémental).
      - name: Save JSONL cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/offi.jsonl
          key: offi-jsonl-${{ github.run_id }}

      # Le JSONL scrapé est aussi exposé en artefact : si l'ingestion échoue, on peut
      # le télécharger et rejouer l'ingest seul (idempotent) sans relancer le scrape.
      - name: Upload JSONL artifact
        if: always() && hashFiles('data/offi.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: offi-jsonl-${{ github.run_id }}
          path: data/offi.jsonl
          retention-days: 7
